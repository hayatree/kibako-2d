# ai-toolkit config. Run from the repository root:
#   python <ai-toolkit>/run.py models/items-klein4b/train.yaml
# Base: FLUX.2-klein-base-4B (Apache-2.0). Captions are the bare item names, so no trigger word.
# Run 1 (the released LoRA): 262 images listed in manifest.jsonl, 2000 steps. The released weights are the
# checkpoint saved at step 1500; step 2000 overfits (potion -> gem, bow -> stick).
---
job: extension
config:
  name: "kibako_items_klein4b_v1"
  process:
    - type: "sd_trainer"
      training_folder: "outputs/items-klein4b"
      device: cuda:0
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 8
      datasets:
        - folder_path: "data/items-klein4b/dataset"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          resolution: [768, 1024]
      train:
        batch_size: 2
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "weighted"
        cache_text_embeddings: true
        optimizer: "adamw"
        lr: 1e-4
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
        arch: "flux2_klein_4b"
        quantize: false
        quantize_te: false
      sample:
        sampler: "flowmatch"
        sample_every: 250
        sample_start_step: 0
        width: 1024
        height: 1024
        guidance_scale: 4
        sample_steps: 25
        seed: 42
        walk_seed: false
        neg: ""
        # Bare item names, as a user would type them. The last four are NOT in the training set.
        prompts:
          - "an iron sword"
          - "a red health potion"
          - "a treasure chest"
          - "a roasted meat on the bone"
          - "a wooden bow"
          - "a magic ring"
          - "a pocket watch"
          - "a cupcake"
meta:
  name: "[name]"
  version: "1.0"
