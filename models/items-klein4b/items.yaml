# Items used to build the training set (generated with FLUX.2 [klein] 4B, Apache-2.0).
# Generic items only: no names of existing characters, brands or franchises.
#
# The caption of each training image is the item name alone. The style comes
# from the prompt template at generation time, so the LoRA learns to produce the
# icon style from the bare item name.

generator: black-forest-labs/FLUX.2-klein-4B
template: "game item icon of {item}, single object, centered, plain white background"
seeds: [0, 1, 2, 3]
width: 1024
height: 1024
steps: 4
guidance: 1.0

