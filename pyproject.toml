[project]
name = "kibako"
version = "0.1.0"
description = "Commercially usable 2D game asset generation: datasets, LoRAs and tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pillow", "pyyaml"]

[dependency-groups]
dev = ["pytest>=8"]
# Image generation (evaluation). Training uses ai-toolkit in its own environment.
gen = ["torch>=2.13", "diffusers", "transformers", "accelerate", "pyyaml", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kibako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
